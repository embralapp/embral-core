[package]
name = "embral"
version = "26.8.3"
description = "Meeting transcription and notes, on your machine."
authors = ["avirut"]
edition = "2021"

[lib]
name = "embral_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# The cloud edition. Everything cloud-only lives in `src/cloud/` behind
# this flag; the offline build must stay green without it.
cloud = ["embral-types/cloud"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-ico", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
# Format-preserving edits of ~/.codex/config.toml (MCP registration when
# the codex CLI is absent): a user's comments and tables must survive.
toml_edit = "0.22"
chrono = { workspace = true }
tokio = { workspace = true }
dirs = { workspace = true }
anyhow = { workspace = true }
embral-types = { path = "../crates/embral-types" }
embral-notes = { path = "../crates/embral-notes" }
embral-db = { path = "../crates/embral-db" }
embral-engine = { path = "../crates/embral-engine" }
embral-search = { path = "../crates/embral-search" }
cpal = "0.15"
hound = "3.5"
rubato = "0.15"
mp3lame-encoder = "0.2"
# rustls, not the platform TLS stack. `embral-engine` and `embral-notes`
# already link rustls, so the default `native-tls` here was the odd one out
# — and on Linux it means OpenSSL, i.e. a `libssl3` the AppImage would have
# to find on the host. Everything reqwest's defaults gave us is listed
# explicitly so the only thing that changes is the TLS backend.
#
# **Native roots, not just webpki.** Plain `rustls-tls` means bundled
# Mozilla roots alone, and asking for it here would have quietly narrowed
# what Windows and macOS trust: `default-tls` used to feed the whole
# workspace's reqwest through schannel / Security.framework, so a machine
# carrying a corporate root CA or sitting behind a TLS-inspecting proxy
# verified fine and would have started failing every model download and
# cloud call — on a build that passes every check.
#
# The two root sets add rather than replace (reqwest extends the store with
# webpki's, then the OS store's), and `embral-engine` / `embral-notes` still
# ask for `rustls-tls`, so webpki stays the floor and the OS store is what
# this flag restores on top. Linux pays nothing for it: `rustls-native-certs`
# reads the cert files instead of linking OpenSSL, so the AppImage still
# needs no `libssl3`.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "stream",
    "charset",
    "http2",
    "macos-system-configuration",
    "rustls-tls-native-roots",
] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# rustls too, and the same system roots as reqwest above. The relay this
# talks to is embral's own backend on a public CA, so bundled roots would
# reach it — but a proxy that terminates TLS sits in front of every host
# equally, and one connection failing where the rest succeed is the harder
# bug to read.
tokio-tungstenite = { version = "0.21", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-native-roots",
] }
async-trait = "0.1"
futures-util = "0.3"
url = "2"
base64 = "0.22"
# `wayland-data-control` adds the wlr protocol arboard needs to reach a
# pure-Wayland session's clipboard; without it the Linux build only talks
# X11 and rides XWayland's bridge, which a Wayland-only session has no
# reason to be running. Inert on Windows and macOS.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }

[dev-dependencies]
# `start_paused` tests: the stall-path deadlines elapse on virtual time,
# so the tests finish instantly instead of really waiting them out.
tokio = { workspace = true, features = ["test-util"] }
# The stale-server sweep tests build their directories somewhere real.
tempfile = "3"

# The Windows platform layer (src/platform/windows/). The macOS build must
# not drag Win32 bindings in; keep every OS-specific dependency under its
# target table.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    # WinRT, for the in-box OCR engine (platform/windows/ocr.rs): the
    # engine itself, the image decoder that feeds it, and the in-memory
    # stream the bytes arrive on. `Media` already implies `Foundation`.
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Variant",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
# The `#[implement]` macro (per-process audio capture's completion
# handler) expands to `windows_core::` paths, so the crate must be nameable
# — the `windows` facade's re-export is not enough.
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
libc = "0.2.189"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSPanel", "NSResponder", "NSRunningApplication", "NSWindow", "NSWorkspace"] }
objc2-application-services = { version = "0.3.2", features = ["HIServices"] }
objc2-av-foundation = { version = "0.3.2", features = ["AVCaptureDevice", "AVMediaFormat"] }
objc2-core-audio = { version = "0.3.2", features = ["objc2", "objc2-foundation", "block2", "dispatch2", "objc2-core-audio-types"] }
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", features = ["CGEvent", "CGEventTypes"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSData", "NSDictionary", "NSProcessInfo", "NSUserDefaults", "NSString"] }
# Vision, for the in-box OCR engine (platform/macos/ocr.rs). The
# objc2-core-foundation feature unlocks boundingBox(), which returns CGRect.
objc2-vision = { version = "0.3.2", features = ["VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes", "objc2-core-foundation"] }

# The Linux platform layer (src/platform/linux/). Kept deliberately small:
# every capability here is either a plain syscall, a freedesktop D-Bus
# interface, or the PulseAudio protocol — no desktop-environment SDKs.
[target.'cfg(target_os = "linux")'.dependencies]
# PR_SET_PDEATHSIG + uname (platform/linux/supervisor.rs, os_build.rs).
libc = "0.2.189"
# The XDG settings portal, for the shell theme + accent
# (platform/linux/theme.rs). Pure Rust — no glib main loop to integrate.
zbus = "5"
# The PulseAudio protocol, for the three audio jobs (platform/linux/pulse.rs,
# mic_users.rs, audio_apps.rs, and loopback.rs from Phase 3). Served by
# PipeWire's pulse layer everywhere that matters; one API covers legacy
# PulseAudio for free.
libpulse-binding = "2.28"
# The blocking record-stream API, for the monitor-source capture lane
# (platform/linux/loopback.rs). A dedicated thread already owns that lane, so
# a blocking read loop is the right shape — no second mainloop to pump.
libpulse-simple-binding = "2.28"
# X11, for dictation's paste chord (XTEST) and the focused-window query
# (platform/linux/input.rs). Pure Rust; only the extensions named here.
x11rb = { version = "0.13", features = ["xtest"] }
# GTK, for the notice window's never-activate hints
# (platform/linux/notice.rs). Version-locked to what Tauri itself links, so
# `gtk_window()`'s type matches.
gtk = "0.18"
