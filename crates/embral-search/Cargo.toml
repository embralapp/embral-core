[package]
name = "embral-search"
version = "0.1.0"
edition = "2021"
description = "Embral's retrieval engine: passage chunking, hybrid FTS+vector search, and the embedding index."

[dependencies]
embral-types = { path = "../embral-types" }
embral-db = { path = "../embral-db" }
embral-notes = { path = "../embral-notes" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
tracing = "0.1"
sha2 = "0.10"
# NO ort/tokenizers here, deliberately: the app links this crate and also
# links sherpa's /MT onnxruntime; ort's /MD objects cannot share that exe
# (LNK2038, proven), and workspace feature unification would drag any
# optional dep in anyway. Inference lives in embral-embedder, which only
# the MCP binary links; this crate consumes vectors it is handed.

[dev-dependencies]
tempfile = "3"
